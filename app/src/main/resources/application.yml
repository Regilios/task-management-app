spring:
  application:
    name: stockflow
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:55432}/${DB_NAME:stockflow}
    username: ${DB_USER:stockflow}
    password: ${DB_PASSWORD:stockflow_local}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  sql:
    init:
      mode: never
server:
  address: ${APP_BIND_ADDRESS:127.0.0.1}
  port: ${APP_PORT:18080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
